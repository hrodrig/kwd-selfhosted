# Daemon shape: ConfigMap must use interval > 0 and http.listen (see run/examples/kwd-daemon.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwd
  namespace: kwd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kwd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwd
    spec:
      serviceAccountName: kwd
      containers:
        - name: kwd
          image: ghcr.io/hrodrig/kwd:v0.2.0
          args: ["check", "--config", "/config/kwd-daemon.yml"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: kwd-notify
                optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: kwd-config
---
apiVersion: v1
kind: Service
metadata:
  name: kwd
  namespace: kwd
spec:
  selector:
    app.kubernetes.io/name: kwd
  ports:
    - name: http
      port: 8080
      targetPort: http
