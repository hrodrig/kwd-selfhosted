# EXAMPLE ONLY — copy to secret.yaml (gitignored locally) or create via kubectl.
# Do not commit real webhook URLs.
#
#   kubectl -n kwd create secret generic kwd-notify \
#     --from-literal=KWD_SLACK_WEBHOOK='https://hooks.slack.com/services/...'
#
apiVersion: v1
kind: Secret
metadata:
  name: kwd-notify
  namespace: kwd
type: Opaque
stringData:
  KWD_SLACK_WEBHOOK: "REPLACE_WITH_SLACK_INCOMING_WEBHOOK_URL"
